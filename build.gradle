plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
evaluationDependsOn(":fabric")
evaluationDependsOn(":neoforge")
//evaluationDependsOn(":forge") //disable forge
publishMods {
    changelog = "Updated for 26.1 Support"
    type = STABLE


    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1421556"
        minecraftVersions.add("26.1")
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "iEtUDGQp"
        minecraftVersions.add("26.1")
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file = project(":fabric").tasks.named("shadowJar").flatMap { it.archiveFile }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
    }

    modrinth("modrinthFabric") {
        from mrOptions
        file = project(":fabric").tasks.named("shadowJar").flatMap { it.archiveFile }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
    }

    curseforge("curseforgeNeoForge") {
        from cfOptions
        file = project(":neoforge").tasks.named("shadowJar").flatMap { it.archiveFile }
        modLoaders.add("neoforge")
    }

    modrinth("modrinthNeoForge") {
        from mrOptions
        file = project(":neoforge").tasks.named("shadowJar").flatMap { it.archiveFile }
        modLoaders.add("neoforge")
    }

//    curseforge("curseforgeForge") { //disable forge
